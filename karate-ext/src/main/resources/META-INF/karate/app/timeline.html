<!--/* A world's record, step by step: what was asked, what the mock decided, the wire folded. The
     record is confirmed and promoted in the console's play view, never here. */-->
<script ka:scope="global">
  _.ui = app.ui;
  _.t = app.timeline(request.pathParams.id);
</script>
<div th:unless="t" data-empty class="rounded-xl border border-dashed border-ink-200 px-6 py-10 text-center">
  <p class="text-sm font-semibold" th:text="'No such ' + ui.resource.label">Not found</p>
</div>
<div th:if="t" class="space-y-6">
  <div>
    <a th:href="t.href" class="text-xs text-ink-500 hover:text-ink-700" th:text="'← ' + ui.resource.label + ' ' + t.key">back</a>
    <h1 class="text-2xl font-semibold tracking-tight">Timeline</h1>
    <p class="mt-1 text-sm text-ink-500 dark:text-ink-400">
      Play record <span data-record class="font-mono" th:text="t.record">play-…</span>
      <a th:if="t.play" data-play-link th:href="t.play" class="ml-2 text-brand-700 dark:text-brand-300 font-medium">Review in the console</a>
    </p>
  </div>
  <p th:if="t.error" class="text-sm text-coral-500" th:text="t.error"></p>
  <ol class="relative border-l border-ink-200 dark:border-ink-700 ml-2 space-y-5">
    <li th:each="s : t.steps" class="ml-5" th:attr="'data-step': s.at, 'data-outcome': s.outcome">
      <span class="absolute -left-1.5 mt-1.5 w-3 h-3 rounded-full"
            th:classappend="s.outcome == 'applied' ? 'bg-emerald-500' : (s.outcome == 'refused' ? 'bg-amber-500' : 'bg-coral-500')"></span>
      <div class="flex items-center gap-2 flex-wrap">
        <span class="text-xs font-mono text-ink-400" th:text="'#' + s.at">#0</span>
        <span class="text-sm font-semibold" th:text="s.title">step</span>
        <span class="px-2 py-0.5 rounded-full text-[11px] font-medium"
              th:classappend="s.outcome == 'applied' ? 'bg-emerald-50 text-emerald-700 dark:bg-emerald-950 dark:text-emerald-300' : 'bg-amber-50 text-amber-700 dark:bg-amber-400/10 dark:text-amber-300'"
              th:attr="'title': s.outcome" th:text="s.outcomeText">Done</span>
        <span th:each="a : s.args" class="text-xs text-ink-500">
          <span th:text="a.label + ':'"></span> <span th:insert="~{components/result :: value}" th:with="c: a"></span>
        </span>
      </div>
      <p th:if="s.reason" class="mt-1 text-xs text-amber-800 dark:text-amber-200">
        <span th:text="s.reasonText">reason</span> <code class="ml-1 text-[11px] text-ink-500" th:text="s.code" data-code>code</code>
      </p>
      <th:block th:insert="~{components/exchange :: exchange}" th:with="x: s.exchange"></th:block>
    </li>
  </ol>
</div>
