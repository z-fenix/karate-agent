<!--/* One world: its view as a card and the action shell — every bound command, enabled per
     Twin.next over the world's record or listed with the model's reason. */-->
<script ka:scope="global">
  var key = request.pathParams.id;
  if (request.post) {
    var posted = app.act(key, request.param('command'), request.paramJson('form'));
    context.init();
    context.flash.result = posted;
    context.redirect(posted.location);
  }
  _.ui = app.ui;
  _.w = app.world(key);
  _.result = context.flash.result;
</script>
<div th:unless="w" data-empty class="rounded-xl border border-dashed border-ink-200 px-6 py-10 text-center">
  <p class="text-sm font-semibold" th:text="'No such ' + ui.resource.label">Not found</p>
  <a href="/" class="mt-2 inline-block text-sm text-brand-700">Back to the list</a>
</div>
<div th:if="w" class="space-y-6" th:attr="'data-world': w.key">
  <div class="flex items-end justify-between gap-4">
    <div>
      <a href="/" class="text-xs text-ink-500 hover:text-ink-700" th:text="'← ' + ui.title">back</a>
      <h1 class="text-2xl font-semibold tracking-tight">
        <span th:text="ui.resource.label">Record</span> <span class="font-mono" th:text="w.key">key</span>
      </h1>
    </div>
    <a th:href="w.href + '/timeline'" data-timeline-link
       class="px-3 py-2 text-sm font-medium rounded-lg border border-ink-200 dark:border-ink-700 hover:bg-white dark:hover:bg-ink-900">Timeline</a>
  </div>

  <th:block th:if="result" th:insert="~{components/result :: result}" th:with="r: result, full: false"></th:block>

  <dl data-card class="bg-white dark:bg-ink-900 rounded-xl shadow-sm border border-ink-100 dark:border-ink-800 p-5 grid grid-cols-2 md:grid-cols-4 gap-x-6 gap-y-3">
    <div th:each="c : w.card" th:attr="'data-field': c.field">
      <dt class="text-[11px] font-semibold uppercase tracking-wide text-ink-500 dark:text-ink-400" th:text="c.label">Field</dt>
      <dd class="text-sm" th:insert="~{components/result :: value}" th:with="c: c"></dd>
    </div>
  </dl>

  <div class="grid md:grid-cols-2 gap-4">
    <th:block th:each="f : w.actions" th:insert="~{components/action :: action}" th:with="f: f, post: w.href"></th:block>
  </div>
</div>
