<div class="alert px-2 py-1 m-1" th:classappend="result.pass ? 'alert-success': 'alert-danger'">
    <span class="px-1">
        <i class="bi bi-check-circle-fill" th:if="result.pass"></i>
        <i class="bi bi-x-circle-fill" th:unless="result.pass"></i>
    </span>
    <span class="text-break" th:text="source"></span>
</div>

<pre th:unless="result.pass" class="bg-danger-subtle p-2 mx-2 border my-1" th:text="result.message"></pre>
