<!--/* The Requirements tab (D96, V1-a) — file-level markdown authoring + preview over requirements/,
     a Flows-editor clone (D88, SSR shell + rich client island). The preview parses the selected file
     server-side-equivalently via Requirement.load (the same verb an LLM uses, P3) and renders the
     requirement TREE (epic → requirement → criteria, rebuilt from each row's `parent`) with an
     "Explore ▶" kickoff per node: the gist + criteria checklist becomes the loop goal (on a
     parent/epic the goal includes every descendant's criteria) and the @req anchor rides the
     kickoff to the run meta — the run's
     evidence then attributes to the requirement as @ai attested hits (MODEL §2b). The kickoff hands
     off to the /runs create form (ONE kickoff surface, D89) with goal + req prefilled. */-->
<script ka:scope="global">
  // SSR the file list (D88): an engine-free scan of the CONFIGURED requirements home(s) (D214d) —
  // page load never queues behind a long bot op on the /api/eval lock. Same shape as /ui/requirements.
  var reqFiles = [];
  var reqHomes = requirementsHomes && requirementsHomes.length ? requirementsHomes : ['requirements'];
  for (var h = 0; h < reqHomes.length; h++) {
    var reqHome = reqHomes[h];
    var mds = file.list(reqHome + '/**/*.md');
    for (var i = 0; mds && i < mds.length; i++) {
      reqFiles.push({ name: mds[i].substring(reqHome.length + 1), home: reqHome });
    }
  }
  reqFiles.sort(function (a, b) { return a.name < b.name ? -1 : 1 });
  _.reqfiles = reqFiles;
</script>

  <!-- Alpine factory — classic script so it exists when Alpine scans x-data (the editor.html ordering note). -->
  <script>
    function reqEditor() {
      return {
        // `selected` is the home-relative name; `selectedHome` the home it came from (D214d) — every
        // read/parse/write carries both, so one spelling lands on one file
        files: [], selected: null, selectedHome: null, loading: false, dirty: false, pendingDoc: null,
        stale: false, err: '',
        creating: false, newName: '',
        viewMode: 'preview', previewHtml: '', parsed: [],
        exploring: null,
        expandedFolders: {},

        // --- sidebar folder tree (one level, the veriquant flows/list.html harvest) ---
        get tree() {
          const folders = {}, root = [];
          this.files.forEach((f) => {
            const idx = f.name.indexOf('/');
            if (idx > 0) {
              const folder = f.name.substring(0, idx);
              (folders[folder] = folders[folder] || []).push(f);
            } else root.push(f);
          });
          return { folders, root };   // members keep the list's sort order
        },
        get folderNames() { return Object.keys(this.tree.folders).sort(); },
        // the configured home the tab is authoring against (D214d), not a literal
        get homeLabel() { return ((this.files[0] || {}).home || 'requirements') + '/'; },
        displayName(f) { const i = f.name.indexOf('/'); return i > 0 ? f.name.substring(i + 1) : f.name; },
        toggleFolder(name) { this.expandedFolders[name] = !this.isFolderExpanded(name); },
        isFolderExpanded(name) {
          if (this.expandedFolders[name] !== undefined) return this.expandedFolders[name];
          // a folder holding the selected file starts expanded
          return this.selected != null && this.selected.indexOf(name + '/') === 0;
        },

        init() {
          window.addEventListener('cm-dirty', () => { this.dirty = true; });
          window.addEventListener('cm-ready', () => {
            if (this.pendingDoc != null) { window.cmEditor.setDoc(this.pendingDoc); this.pendingDoc = null; }
          });
          // the list is SSR-embedded (ka:island, D88) — no /api/eval on page load
          this.files = JSON.parse(document.getElementById('reqfiles-data').textContent) || [];
          // deep-link: /requirements?file=<name> opens that requirement — lets the View.* control plane
          // (or a copied URL) navigate the human's view straight to a SPECIFIC requirement file.
          var dl = new URLSearchParams(location.search).get('file');
          if (dl) { this.select(dl); }
        },
        async refresh() {
          // the /ui/ page-data channel (D98) — never /api/eval for pure data verbs
          this.loading = true; this.err = '';
          try {
            const list = await (await fetch('/ui/requirements')).json();
            this.files = Array.isArray(list) ? list : [];
          } catch (e) { this.err = String(e); }
          this.loading = false;
        },
        // the home defaults server-side (the first configured one) when a deep-link supplies only a name
        query(name, home) {
          return 'name=' + encodeURIComponent(name) + (home ? '&home=' + encodeURIComponent(home) : '');
        },
        async select(name, home) {
          if (this.dirty && !confirm('Discard unsaved changes to ' + this.selected + '?')) return;
          this.err = ''; this.stale = false;
          const out = await (await fetch('/ui/requirements/read?' + this.query(name, home))).json();
          if (out && out.error) { this.err = out.error; return; }
          this.selected = name;
          this.selectedHome = home || null;
          if (window.cmEditor) { window.cmEditor.setDoc(out.content); }
          else { this.pendingDoc = out.content; }
          this.dirty = false;
          this.viewMode = 'preview';
          await this.renderPreview(out.content);
        },
        async showPreview() {
          if (this.dirty) await this.save();
          this.viewMode = 'preview';
          await this.renderPreview();
        },
        // lazy-load the vendored marked once (shared by the card bodies + the plain-md fallback)
        async ensureMarked() {
          if (window.marked) return true;
          try {
            await new Promise((res, rej) => {
              const sc = document.createElement('script');
              sc.src = '/pub/vendor/marked.min.js';
              sc.onload = res; sc.onerror = rej;
              document.head.appendChild(sc);
            });
            return true;
          } catch (e) { return false; }
        },
        // the preview = the PARSED requirement cards (Requirement.load — the same verb an LLM uses)
        // rendered as a TREE (epic → requirement → criteria): hierarchy rides each row's `parent`
        // (heading nesting or @parent=), rebuilt here and flattened DFS with a depth per card;
        // criterion ids and their @req= stamps come from the server (Requirement.list), never derived here.
        async renderPreview(src) {
          this.parsed = [];
          const md = await this.ensureMarked();
          // the requirement body is markdown (the SoT convention — **shall** etc renders, not literal)
          const bodyHtml = (text) => md ? window.marked.parse(text)
            : '<p>' + text.replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</p>';
          try {
            const env = await (await fetch('/ui/requirements/parse?' + this.query(this.selected, this.selectedHome))).json();
            if (env && env.error) throw new Error(env.error);
            const reqs = (env && env.requirements) || [];
            const nodes = reqs.map((r) => ({
              id: r.id, title: r.title || '', type: r.type || '', criticality: r.criticality || '',
              body: r.body || '', bodyHtml: r.body ? bodyHtml(r.body) : '',
              parent: r.parent || null, children: [], depth: 0,
              criteria: (r.criteria || []).map((c) => ({ id: c.id, text: c.text, stamp: c.stamp }))
            }));
            const byId = {};
            nodes.forEach((n) => { byId[n.id] = n; });
            const roots = [];
            // a parent outside this file (a cross-file @parent=) renders as a root here
            nodes.forEach((n) => {
              const p = n.parent && byId[n.parent];
              if (p && p !== n) p.children.push(n); else roots.push(n);
            });
            const flat = [];
            const walk = (n, d) => { n.depth = d; flat.push(n); n.children.forEach((c) => walk(c, d + 1)); };
            roots.forEach((n) => walk(n, 0));
            this.parsed = flat;
          } catch (e) { this.err = String(e); }
          // fall back to a plain markdown render when the file parses to no requirements
          if (!this.parsed.length) {
            const text = src != null ? src : (window.cmEditor ? window.cmEditor.getDoc() : (this.pendingDoc || ''));
            this.previewHtml = md ? window.marked.parse(text)
              : '<pre>' + text.replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</pre>';
          }
        },
        // Explore ▶ — the gist + criteria checklist becomes the loop goal; the @req anchor rides the
        // kickoff. Hands off to the /runs create form (ONE kickoff surface, D89) prefilled, so the
        // user still picks LLM / record / a launchpad flow (the macro-then-explore shape, D91).
        // On a parent/epic the goal includes every descendant's criteria (tree walk), each line
        // carrying its OWN exact @req=<id>/<criterion> token for the model to copy verbatim.
        explore(r) {
          // runtime context the requirement file cannot know — an editable placeholder, not magic:
          // FIRST line of the goal so the user sees + edits it right at the top of the kickoff
          // form's textarea (or deletes it)
          let goal = 'Target app: <replace with the application URL, plus login credentials if needed>\n\n';
          goal += 'Verify requirement ' + r.id + (r.title ? ': ' + r.title : '') + '\n';
          if (r.body) goal += '\n' + r.body + '\n';
          const units = [];
          const collect = (n) => { if (n.criteria.length) units.push(n); n.children.forEach(collect); };
          collect(r);
          if (units.length) {
            goal += '\nVerify each acceptance criterion below; record the verdict with'
              + " Robot.step('<finding> @req=<id>/<criterion>', 'pass' or 'fail')"
              + " and capture bot.screenshot('<evidence> @req=<id>/<criterion>') as proof"
              + ' — use the exact @req token shown beside each criterion:\n';
            units.forEach((n) => {
              if (n !== r) goal += '\n' + n.id + (n.title ? ': ' + n.title : '') + '\n';
              n.criteria.forEach((c) => { goal += '\n- ' + c.stamp + ' — ' + c.text; });
              if (n !== r) goal += '\n';
            });
          }
          const token = Date.now().toString(36) + Math.random().toString(36).slice(2);
          try {
            sessionStorage.setItem('karate.explore.' + token, goal);
          } catch (e) {
            this.err = 'Unable to retain the exploration goal in this tab: ' + e;
            return;
          }
          location.href = '/runs?req=' + encodeURIComponent(r.id) + '&goalRef=' + encodeURIComponent(token);
        },
        async save() {
          if (!this.selected) return;
          const body = window.cmEditor ? window.cmEditor.getDoc() : '';
          const out = await (await fetch('/ui/requirements/write', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: this.selected, home: this.selectedHome, content: body, overwrite: true })
          })).json();
          if (out && out.error) {
            if (out.code === 'STALE_MTIME') { this.stale = true; return; }
            this.err = String(out.error); return;
          }
          this.dirty = false; this.stale = false;
          await this.refresh();
        },
        async reloadFromDisk() {
          this.stale = false; this.dirty = false;
          await this.select(this.selected);
        },
        startNew() { this.creating = true; this.newName = ''; this.$nextTick(() => this.$refs.newInput && this.$refs.newInput.focus()); },
        cancelNew() { this.creating = false; },
        async createFile() {
          // a path creates the folder(s) too (Requirement.write makes parent dirs); a trailing '/' means
          // "just a folder" → drop a starter file in it so the (otherwise invisible) folder appears.
          let name = (this.newName || '').trim().replace(/^\/+/, '');
          if (!name) return;
          if (name.endsWith('/')) name += 'new-requirement';
          if (!name.endsWith('.md')) name += '.md';
          const tmpl = "# Requirements\n\n### REQ-001: Title of the requirement\n@criticality=medium\nThe system **shall** do the thing.\n\n**Acceptance:**\n- 1.1: WHEN <trigger> THE SYSTEM SHALL <response>\n";
          const out = await (await fetch('/ui/requirements/write', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: name, content: tmpl })
          })).json();
          if (out && out.error) { this.err = String(out.error); return; }
          this.creating = false;
          await this.refresh();
          // out.file names what the verb wrote as requirement.list() does: project-relative, so it says its home
          const made = this.files.find((f) => f.home + '/' + f.name === out.file) || { name: name };
          await this.select(made.name, made.home);
        }
      };
    }
  </script>

        doc: '',
        extensions: [
          basicSetup,
          themeConf.of(themeExt()),
          keymap.of([indentWithTab]),
          autocompletion(),
          EditorView.updateListener.of(v => {
            if (!v.docChanged) return;
            if (window.cmEditor && window.cmEditor.loading) { window.cmEditor.loading = false; return; }
            window.dispatchEvent(new CustomEvent('cm-dirty'));
          }),
          EditorView.theme({
            '&': { height: '100%', fontSize: '13px' },
            '.cm-scroller': { fontFamily: '"JetBrains Mono", ui-monospace, monospace' },
          }),
        ],
      }),
      parent: document.getElementById('cm-host'),
    });

    new MutationObserver(() => view.dispatch({ effects: themeConf.reconfigure(themeExt()) }))
      .observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

    window.cmEditor = {
      loading: false,
      getDoc: () => view.state.doc.toString(),
      setDoc: (text) => {
        if ((text || '') === view.state.doc.toString()) return;
        window.cmEditor.loading = true;
        view.dispatch({ changes: { from: 0, to: view.state.doc.length, insert: text || '' } });
      },
    };
    window.dispatchEvent(new CustomEvent('cm-ready'));
  </script>
