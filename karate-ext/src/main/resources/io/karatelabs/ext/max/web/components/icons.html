<!--/* components/icons.html — the shared inline-SVG icon sprite.

  WHY a sprite (not per-icon th:fragment): the file-tree renders rows CLIENT-SIDE (Alpine x-for), so a
  per-row icon can't be a server-side Thymeleaf fragment. Instead this fragment emits one hidden <svg>
  full of <symbol id="ic-*"> once per page; any element — server- OR client-rendered — references one
  with `<svg class="w-4 h-4 text-amber-500"><use href="#ic-js"/></svg>`. The tree does the dynamic form
  `<use :href="'#ic-' + iconKey(n)"/>`.

  Each symbol is fully self-styled (Heroicons-style, 24×24, stroke-width 1.8) EXCEPT colour: paths use
  `stroke="currentColor"`, so the use-site picks the tint with a `text-*` class. Dot glyphs use
  `fill="currentColor"` instead.

  Usage (once, near the top of a page body):  <th:block th:insert="~{components/icons :: sprite}"></th:block>

  Icon keys — file kinds: folder folder-open file code doc photo pdf binary ;
              actions: chevron info dots upload new-file new-folder trash pencil play collapse panel.
*/-->
