<!DOCTYPE html>
<!--
  The simplest browser-agent benchmark target (E1-b.0). A self-contained goal page served by the
  E0 host at /benchmark.html — no deps, plain labelled controls so the loop can find/act/look:
  type a message, submit, and the page echoes "received: <message>". The goal-completion run is
  driven by `Harness.explore('… type "hello" … confirm "received: hello"', {robot:true, async:true})`,
  watchable over noVNC. Deterministic + offline; the LLM is the only non-determinism.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>karate-agent benchmark — echo</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 32rem; margin: 4rem auto; padding: 0 1rem; color: #1e293b; }
    h1 { font-size: 1.4rem; }
    label { display: block; font-weight: 600; margin: 1.5rem 0 .4rem; }
    input { width: 100%; padding: .6rem .7rem; font-size: 1rem; border: 1px solid #cbd5e1; border-radius: .4rem; box-sizing: border-box; }
    button { margin-top: 1rem; padding: .6rem 1.2rem; font-size: 1rem; font-weight: 600; color: #fff; background: #4f46e5; border: 0; border-radius: .4rem; cursor: pointer; }
    button:hover { background: #4338ca; }
    #result { margin-top: 1.5rem; padding: 1rem; border-radius: .4rem; min-height: 1.2rem; }
    #result.empty { color: #94a3b8; font-style: italic; }
    #result.done { background: #ecfdf5; color: #065f46; font-weight: 600; }
  </style>
</head>
<body>
  <h1>Echo benchmark</h1>
  <p>Type a message and submit; the page echoes it back. (A goal-completion target for the browser agent.)</p>

  <label for="message">Message</label>
  <input id="message" name="message" type="text" autocomplete="off" placeholder="type here…">

  <button id="submit" type="button">Submit</button>

  <div id="result" class="empty">No message submitted yet.</div>

  <script>
    document.getElementById('submit').addEventListener('click', function () {
      var msg = document.getElementById('message').value;
      var out = document.getElementById('result');
      if (!msg) { out.className = 'empty'; out.textContent = 'No message submitted yet.'; return; }
      out.className = 'done';
      out.textContent = 'received: ' + msg;
    });
  </script>
</body>
</html>
