<th:block th:with="leaf:type!='array'&&type!='object'">
  <div th:if="leaf" class="json-value" th:classappend="'type-'+type" th:text="data"></div>
  <div class="json-grid" th:unless="leaf" th:each="item: list(data)" th:with="primitive:item[2]!='array'&&item[2]!='object'">
    <div class="d-flex">
      <div class="json-key" th:classappend="'type-'+type" th:text="item[0]"></div>
      <div th:if="primitive" class="json-value" th:classappend="'type-'+item[2]" th:text="item[1]"></div>
    </div>
    <th:block th:unless="primitive" th:insert="this:json-grid-called" th:with="data:item[1],type:item[2]"></th:block>
  </div>
</th:block>
